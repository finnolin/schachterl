config:
  edition: 3

streams:
  user_data:
    auto_subscribe: false
    queries:
      # Users are globally readable because users can create spaces and invite
      # existing users by ID/email. Write authorization still belongs to the
      # application backend.
      - |
        SELECT id, name, created_at
        FROM "user"

      # Resource types are globally readable reference data. They may be
      # assigned to spaces through space_resource_type.
      - |
        SELECT *
        FROM resource_type

      # Relationship types are globally readable reference data.
      - |
        SELECT *
        FROM relationship_type

      # Spaces the authenticated user belongs to.
      - |
        SELECT space.*
        FROM space
        INNER JOIN space_user ON space_user.space_id = space.id
        WHERE space_user.user_id = auth.user_id()

      # All memberships for spaces the authenticated user belongs to. This
      # includes the other members needed for space member lists and invites.
      - |
        SELECT space_user.*
        FROM space_user
        INNER JOIN space_user AS access
          ON access.space_id = space_user.space_id
        WHERE access.user_id = auth.user_id()

      # Resource types enabled for spaces the authenticated user belongs to.
      - |
        SELECT space_resource_type.*
        FROM space_resource_type
        INNER JOIN space_user AS access
          ON access.space_id = space_resource_type.space_id
        WHERE access.user_id = auth.user_id()

      # Resources in spaces the authenticated user belongs to.
      - |
        SELECT resource.*
        FROM resource
        INNER JOIN space_user AS access
          ON access.space_id = resource.space_id
        WHERE access.user_id = auth.user_id()

      # Media in spaces the authenticated user belongs to.
      - |
        SELECT media.*
        FROM media
        INNER JOIN space_user AS access
          ON access.space_id = media.space_id
        WHERE access.user_id = auth.user_id()

      # Relationships in spaces the authenticated user belongs to.
      - |
        SELECT relationship.*
        FROM relationship
        INNER JOIN space_user AS access
          ON access.space_id = relationship.space_id
        WHERE access.user_id = auth.user_id()
