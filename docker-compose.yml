services:
  db:
    image: postgres:18
    container_name: schachterl-db
    restart: always
    command: ['postgres', '-c', 'wal_level=logical']
    ports:
      - '${DB_PORT}:5432'
    environment:
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_NAME}'
    volumes:
      - ./pgdata:/var/lib/postgresql
      - ./pgdumps:/backups
      - ./pginit:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 20

  db-setup:
    image: postgres:18
    container_name: schachterl-db-setup
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: '${DB_USER}'
      PGPASSWORD: '${DB_PASSWORD}'
      PGDATABASE: '${DB_NAME}'
      PS_PASSWORD: '${POWERSYNC_DB_PASSWORD}'
      STORAGE_PASSWORD: '${POWERSYNC_STORAGE_PASSWORD}'
    volumes:
      - ./pgsetup:/setup:ro
    command:
      - sh
      - -c
      - >
        psql -v ON_ERROR_STOP=1
        -v ps_password="$$PS_PASSWORD"
        -v storage_password="$$STORAGE_PASSWORD"
        -f /setup/powersync.sql

  powersync:
    image: journeyapps/powersync-service:latest
    container_name: schachterl-powersync
    restart: always
    depends_on:
      db-setup:
        condition: service_completed_successfully
    command: ['start', '-r', 'unified']
    ports:
      - '${POWERSYNC_PORT}:8080'
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_DATA_SOURCE_URI: 'postgresql://powersync_role:${POWERSYNC_DB_PASSWORD}@db:5432/${DB_NAME}'
      PS_STORAGE_URI: 'postgresql://powersync_storage_user:${POWERSYNC_STORAGE_PASSWORD}@db:5432/powersync_storage'
    volumes:
      - ./powersync:/config:ro